{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RouteOptimizer{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="{% static 'routes/css/style.css' %}" />

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ─── Navigation ─────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark" id="main-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
      <i class="bi bi-geo-alt-fill text-accent"></i>
      <span class="brand-name">Route<span class="text-accent">Optimizer</span></span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
             href="{% url 'index' %}">
            <i class="bi bi-map me-1"></i>Map
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}"
             href="{% url 'history' %}">
            <i class="bi bi-clock-history me-1"></i>History
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/admin/">
            <i class="bi bi-gear me-1"></i>Admin
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ─── Main Content ───────────────────────────────────────────── -->
<main>
  {% block content %}{% endblock %}
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
